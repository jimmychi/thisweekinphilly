services:
  # Backend API server
  - type: web
    name: thisweekinphilly-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://thisweekinphilly.com
      - key: TICKETMASTER_API_KEY
        sync: false   # Set this in Render dashboard
      - key: EVENTBRITE_API_KEY
        sync: false   # Set this in Render dashboard

  # Frontend static site
  - type: web
    name: thisweekinphilly-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://thisweekinphilly-api.onrender.com/api
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache

